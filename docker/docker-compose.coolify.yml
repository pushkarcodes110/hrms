x-frappe-image: &frappe_image
  image: ${FRAPPE_IMAGE:-ghcr.io/frappe/hrms}:${FRAPPE_IMAGE_TAG:-stable}
  pull_policy: ${PULL_POLICY:-always}
  restart: ${RESTART_POLICY:-unless-stopped}

x-frappe-backend: &frappe_backend
  <<: *frappe_image
  depends_on:
    configurator:
      condition: service_completed_successfully
    create-site:
      condition: service_completed_successfully
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  environment:
    DB_HOST: db
    DB_PORT: "3306"
    MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
    MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}

services:
  db:
    image: mariadb:10.6
    restart: ${RESTART_POLICY:-unless-stopped}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:8.6-alpine
    restart: ${RESTART_POLICY:-unless-stopped}

  redis-queue:
    image: redis:8.6-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - redis-queue-data:/data

  configurator:
    <<: *frappe_image
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        set -e;
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host "$$DB_HOST";
        bench set-config -gp db_port "$$DB_PORT";
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port "$$SOCKETIO_PORT";
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    <<: *frappe_image
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - |
        set -euo pipefail

        echo "Waiting for database and Redis..."
        wait-for-it -t 180 db:3306;
        wait-for-it -t 180 redis-cache:6379;
        wait-for-it -t 180 redis-queue:6379;

        echo "Checking Frappe global site config..."
        test -s sites/common_site_config.json

        if [ ! -f "sites/$$SITE_NAME/site_config.json" ]; then
          if [ -d "sites/$$SITE_NAME" ]; then
            echo "Found sites/$$SITE_NAME but no site_config.json. A previous failed deploy may have left a partial site."
            echo "Delete the Coolify application volumes, or change SITE_NAME, then deploy again."
            exit 1
          fi

          echo "Creating site $$SITE_NAME..."
          bench new-site \
            --mariadb-user-host-login-scope='%' \
            --db-root-username=root \
            --db-root-password="$$DB_PASSWORD" \
            --admin-password="$$ADMIN_PASSWORD" \
            --install-app erpnext \
            "$$SITE_NAME"
        else
          echo "Site $$SITE_NAME already exists; skipping site creation."
        fi

        if bench --site "$$SITE_NAME" list-apps | grep -Eq '^erpnext([[:space:]]|$$)'; then
          echo "ERPNext is already installed."
        else
          echo "Installing ERPNext..."
          bench --site "$$SITE_NAME" install-app erpnext
        fi

        if bench --site "$$SITE_NAME" list-apps | grep -Eq '^hrms([[:space:]]|$$)'; then
          echo "HRMS is already installed."
        else
          echo "Installing HRMS..."
          bench --site "$$SITE_NAME" install-app hrms
        fi

        echo "Finalizing site..."
        bench --site "$$SITE_NAME" set-config developer_mode 0
        bench --site "$$SITE_NAME" enable-scheduler
        bench --site "$$SITE_NAME" migrate
        bench use "$$SITE_NAME"
    environment:
      SITE_NAME: ${SITE_NAME:?Set SITE_NAME in Coolify, for example hr.example.com}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Coolify}
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  backend:
    <<: *frappe_backend

  frontend:
    <<: *frappe_image
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$${host}}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
    ports:
      - "${HTTP_PUBLISH_PORT:-8080}:8080"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  websocket:
    <<: *frappe_backend
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js

  queue-short:
    <<: *frappe_backend
    command: bench worker --queue short,default

  queue-long:
    <<: *frappe_backend
    command: bench worker --queue long,default,short

  scheduler:
    <<: *frappe_backend
    command: bench schedule

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
